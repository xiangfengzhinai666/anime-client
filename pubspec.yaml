name: anime_client
description: "追番客户端（个人自用，AniCh 形态复刻）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地存储
  drift: ^2.20.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # 工具
  intl: ^0.19.0
  go_router: ^17.5.0
  dio: ^5.11.1
  crypto: ^3.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  win32: ^6.4.0
  ffi: ^2.2.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  sqlite3: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
